<div class="rsvp-container">
  <p class="rsvp-text">{{ rsvpText }}</p>

  <p class="rsvp-subtext">
    <span *ngIf="formSubmitSuccess">Thank you!</span>
    {{ rsvpSubtext }}
    <br />
    <span *ngIf="formSubmitSuccess">เราได้รับการตอบรับของคุณแล้ว</span>
  </p>

  <p class="rsvp-subtext rsvp-form-error-message" *ngIf="formError">
    {{ formErrorMessage }}
  </p>

  <div class="rsvp-form-container" *ngIf="!formSubmitSuccess">
    <div class="rsvp-form">
      <div class="rsvp-form-group">
        <label for="name">Your name (ชื่อ)*</label>
        <input
          id="name"
          type="text"
          class="rsvp-text-input"
          [formControl]="name"
          required
        />
      </div>
      <div class="rsvp-form-group">
        <label for="attending">
          <span>Are you attending?</span>
          <br />
          <span>(คุณจะมาร่วมงานหรือไม่?) *</span>
        </label>
        <div class="rsvp-radio-group">
          <div class="rsvp-radio-item">
            <input
              type="radio"
              id="yes"
              name="attending"
              value="yes"
              [formControl]="attending"
              required
            />
            <label for="yes">Yes (ใช่)</label>
          </div>
          <div class="rsvp-radio-item">
            <input
              type="radio"
              id="no"
              name="attending"
              value="no"
              [formControl]="attending"
              required
            />
            <label for="no">No (ไม่มา)</label>
          </div>
        </div>
      </div>

      <div class="rsvp-form-group" *ngIf="attending.value === 'yes'">
        <label for="guests">
          <span> Number of guests you'll bring </span>
          <br />
          <span>(จำนวนแขกที่คุณจะพามา)</span>
        </label>
        <input
          id="guests"
          class="rsvp-text-input"
          type="number"
          [formControl]="guests"
          required="{isAttending}"
          min="0"
        />
      </div>
    </div>
  </div>

  <button class="rsvp-button" (click)="submitRsvp()" *ngIf="!formSubmitSuccess">
    {{ rsvpButtonText }}
  </button>

  <p>*If you need a place to stay, please tell us (number of rooms is limited)</p>
  <p>*หากต้องการที่พัก โปรดแจ้ง (มีจำนวนจำกัด)</p>
</div>
